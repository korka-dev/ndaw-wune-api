# Barrière de livraison de l'API (rapport V2, APP-44 / APP-27).
# Toute régression d'accès, de rejeu ou de migration bloque la fusion :
# activer la protection de branche « CI / tests » sur main (réglage GitHub).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      SEANCE_CLEANUP_INTERVAL_SECONDS: "0"
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Migrations sur base vierge
        run: alembic upgrade head
      - name: Modèles et migrations cohérents (aucune suppression implicite)
        run: alembic check
      - name: Retour arrière de la dernière migration puis réapplication
        run: alembic downgrade -1 && alembic upgrade head
      - name: Tests unitaires et d'intégration (PostgreSQL + Redis)
        env:
          INTEGRATION: "1"
        run: python -m pytest -q
