# Toutes les valeurs sont lues depuis .env — aucune valeur en dur ici.

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # max_connections relevé à 220 : avec GUNICORN_WORKERS=9 workers Gunicorn
    # (pool_size 15 + max_overflow 5 chacun, voir .env), le total possible
    # côté app est (15+5)×9 = 180 — 220 laisse ~40 connexions de marge pour
    # psql/migrations/outils d'admin. shared_buffers relevé à 512MB (VPS
    # 4 vCPU/8 Go — voir backend/loadtest/README.md pour la méthode de calcul).
    command: postgres -c max_connections=220 -c shared_buffers=512MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Lié à 127.0.0.1 uniquement — Postgres ne doit jamais être exposé sur Internet.
      # Accessible depuis l'hôte via `psql -h 127.0.0.1`, et depuis les autres
      # conteneurs via le réseau interne Docker (nom de service "db").
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    pull_policy: never
    restart: unless-stopped
    command: >
      sh -c "
        if [ -n '${REDIS_PASSWORD:-}' ]; then
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass '${REDIS_PASSWORD}';
        else
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru;
        fi
      "
    ports:
      # Lié à 127.0.0.1 uniquement — même raisonnement que pour Postgres.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Backend FastAPI ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Surcharge pour utiliser les noms de service Docker (réseau interne)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_URL:    redis://redis:${REDIS_PORT:-6379}/${REDIS_DB:-0}
    ports:
      # Lié à 127.0.0.1 uniquement — le trafic public passe par Caddy/Nginx
      # en reverse proxy sur le VPS (port 80/443), pas directement sur 8000.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Volume persistant pour les fichiers uploadés (ressources pédagogiques)
      - uploads_data:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  uploads_data:
